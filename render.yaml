# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and provisions all three resources below in one go.
#
# After the first deploy, set ANTHROPIC_API_KEY manually in the backend
# service's environment tab if you want the optional LLM enrichment layer.

databases:
  - name: codeintel-db
    plan: free          # change to a paid plan for production workloads
    databaseName: ai_devworkspace
    user: ai_devworkspace_user

services:
  # ---------------------------------------------------------------------
  # Backend: Django REST API
  # ---------------------------------------------------------------------
  - type: web
    name: codeintel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements-postgres.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"          # tighten to your actual .onrender.com / custom domain after first deploy
      - key: DATABASE_URL
        fromDatabase:
          name: codeintel-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://codeintel-frontend.onrender.com"   # update if you rename the static site
      - key: AI_DAILY_QUOTA_PER_USER
        value: "200"
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in the dashboard; optional

  # ---------------------------------------------------------------------
  # Frontend: React + Vite static build
  # ---------------------------------------------------------------------
  - type: web
    name: codeintel-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://codeintel-backend.onrender.com/api"   # update if you rename the backend service
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
